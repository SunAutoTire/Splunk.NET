name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC / Trusted Publisher

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # Fixed: v6 doesn't exist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./artifacts

      - name: Publish to NuGet.org
        uses: nuget/publish-action@v0.3.0  # Fixed: correct action for Trusted Publisher
        with:
          packages-path: ./artifacts/*.nupkg
